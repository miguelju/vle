# Release workflow: triggered when a tag matching `v*` is pushed.
#
# Five jobs run sequentially:
#   build           - calls _build.yml to produce the wheel matrix + sdist
#   publish-pypi    - PyPI Trusted Publishing (OIDC, no token; env: pypi)
#   publish-crates  - cargo publish vle-units then vle-thermo (token loaded
#                     from 1Password at runtime)
#   gh-release      - creates the GitHub Release and attaches all wheels + sdist
#   deploy-sandbox  - SSHes to rocky + Oracle and runs vle-deploy in ONE OF
#                     two modes (see "Deploy modes" below). The wrapper at
#                     /usr/local/bin/vle-deploy on each host is pinned by
#                     ~/.ssh/authorized_keys `command=`.
#
# Deploy modes (selected by the `full_deploy` workflow_dispatch input):
#
#   notebooks  - DEFAULT for every `v*` tag push. SSH command is
#                "notebooks:<tag>" → vle-deploy invokes deploy-notebooks.sh:
#                regenerates index.ipynb + stamps notebooks/.notebook-version.
#                No docker build, no stack restart. Per-user spawns pick up
#                the new content via NOTEBOOK_HOST_PATH bind-mount; existing
#                user volumes re-seed on next login via the version marker.
#                Cost: ~10-15 seconds.
#   full       - workflow_dispatch + full_deploy=true. SSH command is plain
#                "<tag>" → vle-deploy invokes deploy.sh: full image rebuild
#                (notebook + hub) and stack restart. Use this for engine
#                bumps, Dockerfile changes, base-image bumps. Cost: minutes.
#
# Rationale: the hub is an educational sandbox (see deploy/README.md). Most
# `v*` tags only need to update notebook content; the expensive rebuild path
# is reserved for engine/infra changes and gated behind a manual click.
#
# Secrets:
#   GitHub secret OP_SERVICE_ACCOUNT_TOKEN is the *only* GitHub-side secret;
#   everything else (rocky/Oracle SSH keys, Tailscale OAuth, crates.io token,
#   host names) is loaded from 1Password at workflow runtime via
#   1password/load-secrets-action@v2. See docs/ci.md and PUBLISHING.md.

name: Release

on:
  push:
    tags:
      - "v*"
  # Manual lever — two independent toggles:
  #   dry_run=true      build only, skip publish-* and deploy-sandbox
  #   full_deploy=true  use the full image-rebuild path instead of the
  #                     default notebooks-only fast path (only meaningful
  #                     when dispatched against a `v*` tag ref; against
  #                     `main` the deploy will fail the vle-deploy regex)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skip publish-* and deploy-sandbox (build-only smoke test)"
        type: boolean
        required: true
        default: true
      full_deploy:
        description: "Full image rebuild + stack restart (engine bumps). Default = notebooks-only."
        type: boolean
        required: true
        default: false

permissions:
  contents: read

# Opt all JS actions into Node 24 (see comment in _build.yml). Several
# direct deps in this workflow still declare `using: node20` in their
# action.yml — 1password/load-secrets-action@v2, softprops/action-gh-release@v2,
# webfactory/ssh-agent@v0.9.0. The env var forces Node 24 across all of them
# without forcing a same-day major-version bump on each.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build wheels + sdist
    uses: ./.github/workflows/_build.yml
    with:
      artifact-suffix: release

  # check-already-published runs once after the build job and probes each
  # downstream registry (PyPI, crates.io for vle-units + vle-thermo, GitHub
  # Releases) to see whether the current tag is already there. The three
  # publish jobs and gh-release each read these flags via their `if:` to
  # skip themselves on re-runs (e.g., when an auto tag-push deploy has
  # already published and a subsequent `workflow_dispatch full_deploy=true`
  # is just trying to redo the deploy-sandbox step). Without this the
  # second run hits 422 "version already exists" on PyPI / "crate already
  # uploaded" on crates.io, which cascades into deploy-sandbox being
  # skipped because its `needs:` job failed.
  #
  # All probes are read-only HEAD-equivalent requests; no auth needed.
  # See deploy/local/deploy-notes/milestone-07.md "v0.3.1 deploy
  # post-mortem" for the original incident.
  check-already-published:
    name: check what's already published
    needs: [build]
    if: ${{ inputs.dry_run != true }}
    runs-on: ubuntu-latest
    outputs:
      pypi_published:          ${{ steps.check.outputs.pypi_published }}
      crates_units_published:  ${{ steps.check.outputs.crates_units_published }}
      crates_thermo_published: ${{ steps.check.outputs.crates_thermo_published }}
      release_exists:          ${{ steps.check.outputs.release_exists }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          TAG="${GITHUB_REF_NAME}"
          echo "Probing for tag=${TAG} version=${VERSION}"

          if curl -sf -o /dev/null "https://pypi.org/pypi/vle-thermo/${VERSION}/json"; then
            echo "  ✓ vle-thermo ${VERSION} already on PyPI"
            echo "pypi_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "pypi_published=false" >> "$GITHUB_OUTPUT"
          fi

          if curl -sf -o /dev/null "https://crates.io/api/v1/crates/vle-units/${VERSION}"; then
            echo "  ✓ vle-units ${VERSION} already on crates.io"
            echo "crates_units_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "crates_units_published=false" >> "$GITHUB_OUTPUT"
          fi

          if curl -sf -o /dev/null "https://crates.io/api/v1/crates/vle-thermo/${VERSION}"; then
            echo "  ✓ vle-thermo ${VERSION} already on crates.io"
            echo "crates_thermo_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "crates_thermo_published=false" >> "$GITHUB_OUTPUT"
          fi

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "  ✓ GitHub Release ${TAG} already exists"
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi

  publish-pypi:
    name: publish to PyPI
    needs: [build, check-already-published]
    if: ${{ inputs.dry_run != true && needs.check-already-published.outputs.pypi_published != 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/vle-thermo/
    permissions:
      id-token: write   # OIDC for PyPI Trusted Publishing
    steps:
      - name: Download all wheel + sdist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          path: dist
          pattern: "wheels-*-release"
          merge-multiple: true
      - name: Download sdist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: sdist-release
          path: dist
      - name: List collected artifacts
        run: ls -la dist
      - name: Publish to PyPI (Trusted Publishing, OIDC)
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # release/v1
        with:
          packages-dir: dist
          # No `password:` — Trusted Publishing reads the OIDC token from
          # id-token: write above. PyPI must have a Trusted Publisher
          # configured for miguelju/vle + workflow release.yml + env pypi
          # (one-time setup; see PUBLISHING.md).

  publish-crates:
    name: publish to crates.io
    needs: [build, check-already-published]
    # Run the job whenever at least one of the two crates still needs
    # publishing; each `cargo publish` step is itself guarded so it's a
    # no-op when that specific crate is already on the registry.
    if: >-
      ${{ inputs.dry_run != true
          && (needs.check-already-published.outputs.crates_units_published != 'true'
              || needs.check-already-published.outputs.crates_thermo_published != 'true') }}
    runs-on: ubuntu-latest
    # The `crates-io` GitHub Environment is configured with Miguel as a
    # required reviewer (Settings → Environments → crates-io). Every
    # crate publish therefore pauses for a human click in the Actions UI
    # before running `cargo publish`. crates.io versions are *immutable*
    # — once uploaded, a typoed version number is permanent — so this
    # gate is the last chance to catch a wrong version.
    environment:
      name: crates-io
      url: https://crates.io/crates/vle-thermo
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable @ 2026-05-24
      - name: Load crates.io token from 1Password
        uses: 1password/load-secrets-action@581a835fb51b8e7ec56b71cf2ffddd7e68bb25e0  # v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CARGO_REGISTRY_TOKEN: op://vle-thermo-ci/crates-io/token
      - name: cargo publish vle-units
        # vle-units must publish first because vle-thermo depends on it.
        # --no-verify because we already built and tested the wheels in
        # the build job; re-verifying here just slows the release.
        # Skipped when vle-units at this version is already on crates.io
        # (the registry rejects duplicates with a non-zero exit, which
        # would fail the workflow; the check-already-published probe
        # detects this in advance).
        if: ${{ needs.check-already-published.outputs.crates_units_published != 'true' }}
        run: cargo publish -p vle-units --no-verify
      - name: cargo publish vle-thermo
        if: ${{ needs.check-already-published.outputs.crates_thermo_published != 'true' }}
        run: cargo publish -p vle-thermo --no-verify

  gh-release:
    name: create GitHub Release
    needs: [build, check-already-published]
    if: ${{ inputs.dry_run != true && needs.check-already-published.outputs.release_exists != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # for softprops/action-gh-release to create the release
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          path: artifacts
      - name: Flatten artifacts into a single dist/ dir
        run: |
          mkdir -p dist
          find artifacts -name '*.whl' -exec cp {} dist/ \;
          find artifacts -name '*.tar.gz' -exec cp {} dist/ \;
          ls -la dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  deploy-sandbox:
    name: deploy sandbox (rocky + Oracle)
    needs: [publish-pypi, publish-crates, gh-release]
    # Run deploy-sandbox whenever a real release is happening (`dry_run !=
    # true`) AND no upstream job actually failed. We deliberately use
    # `!failure() && !cancelled()` instead of the implicit `success()` so a
    # *skipped* publish job (e.g. version was already on PyPI / crates.io,
    # see check-already-published) doesn't drag deploy-sandbox down with it.
    # That's what enables `gh workflow run release.yml -f full_deploy=true
    # --ref vX.Y.Z` to redo just the deploy half against an already-published
    # tag — which is the canonical recovery path documented in
    # deploy/local/deploy-notes/milestone-07.md.
    #
    # Also skipped in dry-run: deploy-sandbox needs a real git tag on origin
    # to check out, and workflow_dispatch from `main` has no such tag.
    # SSH/force-command plumbing was already validated by the
    # install-{rocky,oracle}.sh smoke tests on 2026-05-21, so dry-run safely
    # omits this job.
    if: ${{ inputs.dry_run != true && !failure() && !cancelled() }}
    # Self-hosted runner that lives permanently on the tailnet (CT 105,
    # tag:vle-runner). Has direct LAN access to rocky and tailnet access to
    # Oracle, so no per-job Tailscale join is needed.
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Load deploy secrets from 1Password
        uses: 1password/load-secrets-action@581a835fb51b8e7ec56b71cf2ffddd7e68bb25e0  # v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN:        ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          ROCKY_HOST:                      op://vle-thermo-ci/rocky-deploy/hostname
          ROCKY_USER:                      op://vle-thermo-ci/rocky-deploy/username
          ROCKY_SSH_KEY:                   op://vle-thermo-ci/rocky-deploy/private_key
          ROCKY_HOST_KEY_FINGERPRINT:      op://vle-thermo-ci/rocky-deploy/host_key_fingerprint
          ORACLE_HOST:                     op://vle-thermo-ci/oracle-deploy/tailnet_hostname
          ORACLE_USER:                     op://vle-thermo-ci/oracle-deploy/username
          ORACLE_SSH_KEY:                  op://vle-thermo-ci/oracle-deploy/private_key
      - name: Set up SSH agent with both deploy keys
        uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387  # v0.9.0
        with:
          ssh-private-key: |
            ${{ env.ROCKY_SSH_KEY }}
            ${{ env.ORACLE_SSH_KEY }}
      - name: Pin rocky's host key
        # Pull the host keys fresh and verify the stored SHA-256 fingerprint
        # matches *any* of them. rocky advertises three host keys (RSA,
        # ECDSA, ED25519) and ssh-keyscan returns them in non-deterministic
        # order, so we can't pick "the first" — we match against the full
        # set. If none match (host reinstall, MITM), the step fails and the
        # deploy aborts.
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -H "$ROCKY_HOST" > /tmp/rocky_known
          if [[ -z "$ROCKY_HOST_KEY_FINGERPRINT" ]]; then
            echo "ROCKY_HOST_KEY_FINGERPRINT not set in 1Password" >&2
            exit 1
          fi
          actual_set=$(ssh-keygen -lf /tmp/rocky_known | awk '{print $2}')
          if ! echo "$actual_set" | grep -qF "$ROCKY_HOST_KEY_FINGERPRINT"; then
            echo "rocky host-key fingerprint mismatch" >&2
            echo "  expected (any of these):" >&2
            echo "$actual_set" | sed 's/^/    /' >&2
            echo "  stored: $ROCKY_HOST_KEY_FINGERPRINT" >&2
            exit 1
          fi
          cat /tmp/rocky_known >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Pick deploy mode (notebooks vs. full)
        id: mode
        # On tag-push, inputs.full_deploy is empty (input only exists in
        # workflow_dispatch context), so the string compare picks notebooks.
        # On workflow_dispatch + full_deploy=true, picks full. Either way we
        # compose a single SSH command string consumed by vle-deploy on the
        # other side via the authorized_keys `command=` force-command.
        run: |
          if [[ "${{ inputs.full_deploy }}" == "true" ]]; then
            echo "ssh_command=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "==> Mode: full image rebuild (engine bump)"
          else
            echo "ssh_command=notebooks:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "mode=notebooks" >> "$GITHUB_OUTPUT"
            echo "==> Mode: notebooks-only fast path"
          fi
      - name: Deploy to rocky (plain SSH)
        # The host's authorized_keys binds this key to
        # `command="/usr/local/bin/vle-deploy"`. SSH_ORIGINAL_COMMAND on the
        # other end will be the value computed above ("<tag>" for full mode
        # or "notebooks:<tag>" for the fast path). The wrapper regex-validates
        # before doing anything destructive.
        run: |
          ssh -o StrictHostKeyChecking=yes \
              -o BatchMode=yes \
              "$ROCKY_USER@$ROCKY_HOST" \
              "${{ steps.mode.outputs.ssh_command }}"
      - name: Deploy to Oracle (SSH over Tailscale)
        # ORACLE_HOST resolves via MagicDNS because the self-hosted runner
        # (CT 105, tag:vle-runner) is a permanent tailnet member. No
        # StrictHostKeyChecking pin needed — Tailscale's authentication
        # already establishes endpoint identity.
        run: |
          ssh -o BatchMode=yes \
              -o StrictHostKeyChecking=accept-new \
              "$ORACLE_USER@$ORACLE_HOST" \
              "${{ steps.mode.outputs.ssh_command }}"
