# Release workflow: triggered when a tag matching `v*` is pushed.
#
# Jobs:
#   check-already-published - probe PyPI / crates.io / GitHub Releases so a
#                     re-run skips already-published targets (idempotent release)
#   build           - calls _build.yml to produce the wheel matrix + sdist
#   publish-pypi    - PyPI Trusted Publishing (OIDC, no token; env: pypi)
#   publish-crates  - cargo publish vle-units then vle-thermo (token loaded
#                     from 1Password at runtime; env: crates-io)
#   gh-release      - creates the GitHub Release and attaches all wheels + sdist
#
# Deploying the teaching hub is NO LONGER part of this pipeline. The
# Docker-Compose JupyterHub stack moved to the operator's private homelab-iac
# repo; after a release, refresh the hub from there via the gated `deploy-vle`
# workflow / `ansible-playbook playbooks/deploy-vle.yml` (notebooks or full
# mode). See PUBLISHING.md.
#
# Secrets:
#   GitHub secret OP_SERVICE_ACCOUNT_TOKEN is the *only* GitHub-side secret;
#   the crates.io token is loaded from 1Password at workflow runtime via
#   1password/load-secrets-action@v2. See docs/ci.md and PUBLISHING.md.

name: Release

on:
  push:
    tags:
      - "v*"
  # Manual lever: dry_run=true builds only (skips publish-*) for a build-only
  # smoke test. A real re-run (dry_run=false) against an already-published tag
  # is safe — check-already-published makes each publish job skip itself.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skip publish-* (build-only smoke test)"
        type: boolean
        required: true
        default: true

permissions:
  contents: read

# Opt all JS actions into Node 24 (see comment in _build.yml). Several
# direct deps in this workflow still declare `using: node20` in their
# action.yml — 1password/load-secrets-action@v2, softprops/action-gh-release@v2,
# webfactory/ssh-agent@v0.9.0. The env var forces Node 24 across all of them
# without forcing a same-day major-version bump on each.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # check-already-published runs FIRST (before the build) and probes each
  # downstream registry (PyPI, crates.io for vle-units + vle-thermo, GitHub
  # Releases) to see whether the current tag is already there. The three
  # publish jobs and gh-release each read these flags via their `if:` to
  # skip themselves on re-runs (e.g., when a prior run published PyPI but
  # crates.io failed midway, and you re-run the tag to finish it). Without
  # this the second run hits 422 "version already exists" on PyPI / "crate
  # already uploaded" on crates.io and fails.
  #
  # It runs before `build` (rather than after) so the build job can gate
  # itself on these flags and skip the expensive wheel+sdist rebuild when a
  # re-run of an already-published tag has nothing left to build for. The
  # probe only needs the tag ref + curl/gh — no artifacts — so it has no
  # dependency on the build.
  #
  # All probes are read-only HEAD-equivalent requests; no auth needed.
  # See deploy/local/deploy-notes/milestone-07.md "v0.3.1 deploy
  # post-mortem" for the original incident.
  check-already-published:
    name: check what's already published
    if: ${{ inputs.dry_run != true }}
    runs-on: ubuntu-latest
    outputs:
      pypi_published:          ${{ steps.check.outputs.pypi_published }}
      crates_units_published:  ${{ steps.check.outputs.crates_units_published }}
      crates_thermo_published: ${{ steps.check.outputs.crates_thermo_published }}
      release_exists:          ${{ steps.check.outputs.release_exists }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          TAG="${GITHUB_REF_NAME}"
          echo "Probing for tag=${TAG} version=${VERSION}"

          if curl -sf -o /dev/null "https://pypi.org/pypi/vle-thermo/${VERSION}/json"; then
            echo "  ✓ vle-thermo ${VERSION} already on PyPI"
            echo "pypi_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "pypi_published=false" >> "$GITHUB_OUTPUT"
          fi

          # crates.io rejects requests without a User-Agent (HTTP 403), so
          # the `-A` flag is load-bearing: a UA-less `curl -sf` fails for
          # *every* request, making the probe always report "not published",
          # which re-runs `cargo publish` on an already-published version and
          # fails the release with "already exists". (Bit us on a v0.4.0 re-run.)
          CRATES_UA="vle-thermo-ci (https://github.com/${GITHUB_REPOSITORY})"
          if curl -sf -A "${CRATES_UA}" -o /dev/null "https://crates.io/api/v1/crates/vle-units/${VERSION}"; then
            echo "  ✓ vle-units ${VERSION} already on crates.io"
            echo "crates_units_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "crates_units_published=false" >> "$GITHUB_OUTPUT"
          fi

          if curl -sf -A "${CRATES_UA}" -o /dev/null "https://crates.io/api/v1/crates/vle-thermo/${VERSION}"; then
            echo "  ✓ vle-thermo ${VERSION} already on crates.io"
            echo "crates_thermo_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "crates_thermo_published=false" >> "$GITHUB_OUTPUT"
          fi

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "  ✓ GitHub Release ${TAG} already exists"
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build wheels + sdist
    needs: [check-already-published]
    # Skip the (expensive) wheel + sdist rebuild when there is nothing left
    # to build *for*. The only consumers of these artifacts are publish-pypi,
    # publish-crates, and gh-release.
    #
    # Build runs when:
    #   - it's a build-only smoke test (dry_run == true), or
    #   - any publish/release target for this tag still needs the artifacts.
    # `always()` is required so this evaluates even though
    # check-already-published is *skipped* in dry-run (its outputs are then
    # empty strings, so every `!= 'true'` clause is true and the build runs —
    # exactly what a build-only smoke test wants). When every target is
    # already published, all clauses are false and the build is skipped; the
    # publish/release jobs then skip too (their own `if:` guards).
    if: >-
      ${{ always() && (
        inputs.dry_run == true
        || needs.check-already-published.outputs.pypi_published != 'true'
        || needs.check-already-published.outputs.crates_units_published != 'true'
        || needs.check-already-published.outputs.crates_thermo_published != 'true'
        || needs.check-already-published.outputs.release_exists != 'true'
      ) }}
    uses: ./.github/workflows/_build.yml
    with:
      artifact-suffix: release

  publish-pypi:
    name: publish to PyPI
    needs: [build, check-already-published]
    if: ${{ inputs.dry_run != true && needs.check-already-published.outputs.pypi_published != 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/vle-thermo/
    permissions:
      id-token: write   # OIDC for PyPI Trusted Publishing
    steps:
      - name: Download all wheel + sdist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          path: dist
          pattern: "wheels-*-release"
          merge-multiple: true
      - name: Download sdist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: sdist-release
          path: dist
      - name: List collected artifacts
        run: ls -la dist
      - name: Publish to PyPI (Trusted Publishing, OIDC)
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # release/v1
        with:
          packages-dir: dist
          # No `password:` — Trusted Publishing reads the OIDC token from
          # id-token: write above. PyPI must have a Trusted Publisher
          # configured for miguelju/vle + workflow release.yml + env pypi
          # (one-time setup; see PUBLISHING.md).

  publish-crates:
    name: publish to crates.io
    needs: [build, check-already-published]
    # Run the job whenever at least one of the two crates still needs
    # publishing; each `cargo publish` step is itself guarded so it's a
    # no-op when that specific crate is already on the registry.
    if: >-
      ${{ inputs.dry_run != true
          && (needs.check-already-published.outputs.crates_units_published != 'true'
              || needs.check-already-published.outputs.crates_thermo_published != 'true') }}
    runs-on: ubuntu-latest
    # The `crates-io` GitHub Environment is configured with Miguel as a
    # required reviewer (Settings → Environments → crates-io). Every
    # crate publish therefore pauses for a human click in the Actions UI
    # before running `cargo publish`. crates.io versions are *immutable*
    # — once uploaded, a typoed version number is permanent — so this
    # gate is the last chance to catch a wrong version.
    environment:
      name: crates-io
      url: https://crates.io/crates/vle-thermo
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          # See ci.yml — same belt-and-suspenders. `cargo publish`
          # doesn't push back to the repo; GITHUB_TOKEN stays out
          # of .git/config.
          persist-credentials: false
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable @ 2026-05-24
      - name: Load crates.io token from 1Password
        uses: 1password/load-secrets-action@581a835fb51b8e7ec56b71cf2ffddd7e68bb25e0  # v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CARGO_REGISTRY_TOKEN: op://vle-thermo-ci/crates-io/token
      - name: cargo publish vle-units
        # vle-units must publish first because vle-thermo depends on it.
        # --no-verify because we already built and tested the wheels in
        # the build job; re-verifying here just slows the release.
        # Skipped when vle-units at this version is already on crates.io
        # (the registry rejects duplicates with a non-zero exit, which
        # would fail the workflow; the check-already-published probe
        # detects this in advance).
        if: ${{ needs.check-already-published.outputs.crates_units_published != 'true' }}
        run: cargo publish -p vle-units --no-verify
      - name: cargo publish vle-thermo
        if: ${{ needs.check-already-published.outputs.crates_thermo_published != 'true' }}
        run: cargo publish -p vle-thermo --no-verify

  gh-release:
    name: create GitHub Release
    needs: [build, check-already-published]
    if: ${{ inputs.dry_run != true && needs.check-already-published.outputs.release_exists != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # for softprops/action-gh-release to create the release
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          path: artifacts
      - name: Flatten artifacts into a single dist/ dir
        run: |
          mkdir -p dist
          find artifacts -name '*.whl' -exec cp {} dist/ \;
          find artifacts -name '*.tar.gz' -exec cp {} dist/ \;
          ls -la dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
