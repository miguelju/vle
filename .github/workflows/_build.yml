# Reusable workflow: builds the wheel matrix + sdist and uploads them as
# `wheels-${{ inputs.artifact-suffix }}` artifacts. Called by ci.yml
# (artifact-only smoke build) and release.yml (the actual release matrix).
#
# Runners used — all GitHub-hosted:
#   Linux x86_64 -> ubuntu-latest
#   Linux arm64  -> ubuntu-24.04-arm
#   macOS arm64  -> macos-14
#   Windows      -> windows-latest
#
# This repo is PUBLIC, and standard GitHub-hosted runners are free and
# unlimited on public repositories — macOS and arm64 included (the billing
# split is standard-vs-larger runners, not Linux-vs-macOS). So the wheel
# matrix has no reason to touch lab hardware.
#
# Wheels built here were previously produced on self-hosted runners for
# linux-x86_64 and macos-arm64. That was dropped because it bought nothing
# and cost two real things:
#   1. Serialization. The self-hosted Linux runner is EPHEMERAL (one job per
#      container), so a tag push racing a main push put the release third in
#      line behind CI's bench job — measured at ~8 min of dead wait on the
#      v0.12.0 release.
#   2. Blast radius. cibuildwheel needs Docker for manylinux, so that runner
#      mounted /var/run/docker.sock — root-equivalent on the LXC host, on a
#      public repo, with a fork-PR `if:` guard as the only thing in the way.
# Platform tags are unchanged: the manylinux image and the macOS deployment
# target are both pinned in python/pyproject.toml, so the wheels are
# byte-for-byte equivalent in compatibility to the self-hosted ones.
#
# The one job that stays on lab hardware is ci.yml's criterion bench, where a
# quiet dedicated machine is the whole point — see the note there.

name: _build

on:
  workflow_call:
    inputs:
      artifact-suffix:
        description: "Suffix appended to each uploaded artifact name"
        type: string
        required: false
        default: "ci"

permissions:
  contents: read

jobs:
  # ----- The whole wheel matrix, all GitHub-hosted -----
  # Runs on every push/PR including fork PRs — no lab exposure, so no
  # fork-PR `if:` guard is needed and all four rows run in parallel.
  build-hosted:
    name: build (${{ matrix.os }}-${{ matrix.arch }} hosted)
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x86_64
            runs-on: ubuntu-latest
          - os: linux
            arch: aarch64
            runs-on: ubuntu-24.04-arm
          - os: macos
            arch: arm64
            runs-on: macos-14
          - os: windows
            arch: AMD64
            runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          # See ci.yml — same belt-and-suspenders. Wheel builds don't
          # push back to the repo; GITHUB_TOKEN stays out of .git/config.
          persist-credentials: false
      - name: Cache cargo registry + git
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ matrix.os }}-${{ matrix.arch }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            cargo-${{ matrix.os }}-${{ matrix.arch }}-
      # We pin actions/setup-python@v6 at a SHA so the outer cibuildwheel
      # driver is reproducible and visible to the repo's
      # `sha_pinning_required: true` policy, then invoke cibuildwheel
      # directly rather than through the `pypa/cibuildwheel` composite
      # action: that action internally references `actions/setup-python@v5`
      # *by tag* (see cibuildwheel/action.yml), which the SHA-pinning policy
      # refuses. cibuildwheel still downloads its own target Pythons under
      # ~/.cibuildwheel and builds against those, so only the *outer* Python
      # that runs cibuildwheel is affected.
      - name: Install Python (for the cibuildwheel driver)
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.12"
      - name: Build wheel via cibuildwheel (no composite action)
        shell: bash
        env:
          CIBW_BUILD_VERBOSITY: 1
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'cibuildwheel==2.21.3'
          python -m cibuildwheel --output-dir wheelhouse python
      - name: Upload wheels artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}-${{ inputs.artifact-suffix }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 14

  # ----- Source distribution -----
  sdist:
    name: build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          # See ci.yml — same belt-and-suspenders. Wheel builds don't
          # push back to the repo; GITHUB_TOKEN stays out of .git/config.
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.12"
      - name: Install maturin
        run: pip install "maturin>=1.5,<2"
      - name: Build sdist
        working-directory: python
        run: maturin sdist --out dist
      - name: Upload sdist artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: sdist-${{ inputs.artifact-suffix }}
          path: python/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14
