# CI workflow: every push to main, every PR (fork PRs included), and any
# manual workflow_dispatch.
#
# Jobs:
#   lint-rust  : cargo fmt + clippy on ubuntu-latest
#   test-rust  : cargo test on ubuntu-latest
#   bench-rust : criterion on the self-hosted Linux runner — the only job in
#                this repo still on lab hardware, because benchmark deltas
#                need a quiet dedicated machine. Informational, never blocks,
#                and skipped for fork PRs.
#
# Wheel-matrix smoke build lives in build-smoke.yml (path-filtered to
# code-affecting commits only). Release / publishing lives in
# release.yml (tag v* only). See PUBLISHING.md and docs/ci.md for the
# end-to-end picture.

name: CI

on:
  # paths-ignore lists directories whose changes can't affect a Rust
  # compile, the Python wheel contents, or the test suite — pure
  # documentation, JupyterLab notebook content, deployment scripts,
  # and legacy reference sources (VB6 / Pascal — never compiled).
  # A commit that touches *only* these paths skips CI entirely
  # (lint + test + wheel-matrix). A commit that touches *any other*
  # file — including .rs, .py, .toml, Cargo.lock, .github/**, or
  # scripts/* — still runs the full pipeline. Note: paths-ignore
  # matches when *every* changed file matches the patterns, so a
  # mixed-bag commit (e.g. "fix engine bug + update README") still
  # runs CI.
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'notebooks/**'
      - 'deploy/**'
      - 'legacy/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'notebooks/**'
      - 'deploy/**'
      - 'legacy/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-rust:
    name: lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          # Don't leave the GITHUB_TOKEN in .git/config after checkout —
          # belt-and-suspenders against a subsequent step (compromised or
          # otherwise) re-using it to push back to the repo. No job here
          # pushes, so dropping the token is safe.
          persist-credentials: false
      - name: Install stable Rust + components
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable @ 2026-05-24
        with:
          components: rustfmt, clippy
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        # `-D warnings` turns every clippy warning into an error so style
        # regressions can't sneak in. Adjust per-crate via lint attributes
        # if a specific warning needs to be tolerated.
        run: cargo clippy --workspace --all-targets -- -D warnings

  # `cargo test --workspace --all-targets` is a couple of minutes of CPU with
  # no special hardware needs, so it runs hosted: free and unlimited on a
  # public repo, and — unlike the single ephemeral lab runner — it does not
  # serialize behind whatever else the repo pushed at the same moment.
  # Running hosted also drops the fork-PR guard this job used to need, so
  # contributors get test feedback on their PRs instead of a skipped job.
  test-rust:
    name: test (cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          # Don't leave the GITHUB_TOKEN in .git/config after checkout —
          # belt-and-suspenders against a subsequent step (compromised or
          # otherwise) re-using it to push back to the repo. No job here
          # pushes, so dropping the token is safe.
          persist-credentials: false
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable @ 2026-05-24
      - name: Cache cargo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-test-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
      - name: cargo test
        run: cargo test --workspace --all-targets

  # Informational benchmark job (M8.2, PERFORMANCE_PROPOSAL.md Track E).
  # Reports criterion deltas against the previous cached run and NEVER
  # blocks the pipeline (continue-on-error). Runs only on pushes to main
  # and manual dispatch — PR-time benchmarking on a shared ephemeral
  # runner is noise, not signal. criterion compares against whatever
  # baseline is in target/criterion (restored from the cache below), so
  # each main push logs its delta vs the previous main push.
  #
  # This is the ONLY job left on lab hardware, deliberately. Criterion deltas
  # are meaningless on a shared hosted VM: measured drift on a dedicated idle
  # machine is already +/-3..5% between sessions, and a noisy neighbour would
  # swamp the signal entirely. A quiet dedicated runner is the whole reason
  # this job produces a number worth reading.
  #
  # It stays safe to leave here because it is `continue-on-error: true`,
  # never blocks, skips fork PRs, and needs no Docker — so the runner no
  # longer needs its /var/run/docker.sock mount (that was for cibuildwheel's
  # manylinux container, which now runs hosted).
  bench-rust:
    name: bench (criterion, informational)
    # Pinned to the repo-specific `vle-runner` label rather than the generic
    # `x64`. CT 105 hosts one runner container per repo; a bare
    # `[self-hosted, linux, x64]` would match any Linux runner that ever gets
    # added to this repo, which is exactly the ambiguity the per-repo label
    # exists to remove. The sibling container uses `webpage-runner`.
    runs-on: [self-hosted, linux, vle-runner]
    continue-on-error: true
    # Restricting to push/workflow_dispatch IS the fork-PR guard: a fork's
    # push never triggers this repo's workflows, and a `pull_request` event
    # fails both arms. No `head.repo.full_name` check needed — adding one
    # would be dead logic that reads like it is load-bearing.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable @ 2026-05-24
      - name: Cache cargo + criterion baseline
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Keyed on the lockfile like the test cache, but with a distinct
          # prefix so bench artifacts (including the criterion baseline
          # under target/criterion) don't churn the test cache. The
          # restore-key fallback lets a Cargo.lock bump still restore the
          # previous baseline for delta reporting.
          key: cargo-bench-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            cargo-bench-
      - name: cargo bench (deltas vs previous run)
        run: cargo bench -p vle-thermo

# The wheel-matrix smoke build moved to .github/workflows/build-smoke.yml
# so it can be path-filtered independently of lint + test. Releases still
# go through .github/workflows/release.yml (which calls _build.yml for
# the real publishable artifacts).
