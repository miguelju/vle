# CI workflow: every push to main, every PR (except fork-PRs against
# self-hosted runners, which are gated by the if: in _build.yml), and any
# manual workflow_dispatch.
#
# Jobs:
#   lint-rust  : cargo fmt + clippy on ubuntu-latest (cheap, public)
#   test-rust  : cargo test on the self-hosted Linux runner (clean ephemeral
#                container per run)
#   build      : invokes _build.yml to produce the wheel matrix as
#                artifact `wheels-*-ci` (no publish on this workflow)
#
# Release / publishing lives in release.yml (tag v* only). See PUBLISHING.md
# and docs/ci.md for the end-to-end picture.

name: CI

on:
  # paths-ignore lists directories whose changes can't affect a Rust
  # compile, the Python wheel contents, or the test suite — pure
  # documentation, JupyterLab notebook content, deployment scripts,
  # and legacy reference sources (VB6 / Pascal — never compiled).
  # A commit that touches *only* these paths skips CI entirely
  # (lint + test + wheel-matrix). A commit that touches *any other*
  # file — including .rs, .py, .toml, Cargo.lock, .github/**, or
  # scripts/* — still runs the full pipeline. Note: paths-ignore
  # matches when *every* changed file matches the patterns, so a
  # mixed-bag commit (e.g. "fix engine bug + update README") still
  # runs CI.
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'notebooks/**'
      - 'deploy/**'
      - 'legacy/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'notebooks/**'
      - 'deploy/**'
      - 'legacy/**'
  workflow_dispatch:

permissions:
  contents: read

# Opt all JS actions into Node 24 (see comment in _build.yml). The reusable
# build workflow sets this on its own, but CI's lint/test jobs also invoke
# checkout/cache directly, so we mirror the setting here.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-rust:
    name: lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - name: Install stable Rust + components
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable @ 2026-05-24
        with:
          components: rustfmt, clippy
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        # `-D warnings` turns every clippy warning into an error so style
        # regressions can't sneak in. Adjust per-crate via lint attributes
        # if a specific warning needs to be tolerated.
        run: cargo clippy --workspace --all-targets -- -D warnings

  test-rust:
    name: test (cargo test)
    runs-on: [self-hosted, linux, x64]
    # Fork-PR guard: keep PRs from forks off the lab runner.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable @ 2026-05-24
      - name: Cache cargo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-test-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
      - name: cargo test
        run: cargo test --workspace --all-targets

  build:
    name: build wheels
    needs: [lint-rust]
    uses: ./.github/workflows/_build.yml
    with:
      artifact-suffix: ci
