[package]
name = "vle-thermo"
description = "Vapor-liquid equilibrium thermodynamic calculator: 22+ cubic EOS, activity models, mixing rules, flash algorithms"
readme = "README.md"
keywords = ["thermodynamics", "chemistry", "vle", "equation-of-state", "fluid"]
categories = ["science", "mathematics"]
documentation = "https://docs.rs/vle-thermo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
# The `cdylib` artifact is what maturin packages into the Python wheel as
# `vle/_engine.*.{so,dylib,pyd}`; the `rlib` artifact is what downstream Rust
# crates link against via `cargo add vle-thermo`.
name = "vle_thermo"
crate-type = ["cdylib", "rlib"]

[dependencies]
nalgebra = "0.33"
# Component database parsing (M12.2, gap G3). Both crates are OPTIONAL and
# pulled in only by the `component-db` feature, so the default pure-Rust
# crate stays serde-free. `serde` derives `Deserialize` on the JSON DTO in
# `db.rs`; `serde_json` parses the `include_str!`-embedded catalog once.
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
# Dual-number automatic differentiation (M8.3, PERFORMANCE_PROPOSAL §B3):
# the mixture fugacity path is written generic over `DualNum<f64>`, so the
# exotic GE-based mixing rules (Wong-Sandler, MHV1/2) get exact-to-machine-
# precision ∂ln φ̂ᵢ/∂nⱼ by evaluating the same code with dual numbers —
# no finite differences (those survive only as test oracles). Built by the
# FeOS authors for exactly this use. 0.11 is the newest release compatible
# with our rust-version 1.85 (0.14 needs rustc 1.89).
num-dual = { version = "0.11", default-features = false }
# Stack-allocated small vectors (M8.2, PERFORMANCE_PROPOSAL §C3): mixture
# hot paths use `SmallVec<[f64; 8]>` so compositions up to 8 components
# never touch the heap (larger mixtures spill transparently). 8 covers
# every Chapter IV validation case (max 4 components) with headroom.
smallvec = "1"
thiserror = "1"
# Sibling crate in the workspace. We pull it in to re-export the canonical
# unit catalog (`vle_units::default_units_toml`) through PyO3, so the Python
# wrapper drives `pint` from the same TOML the Rust registry uses.
# The `version` is required for `cargo publish` (path is local-only); we keep
# it in sync with the workspace version by hand. Bump alongside the workspace
# version in `Cargo.toml`.
vle-units = { path = "../units", version = "0.10.0" }
# Sibling steam-tables crate (M13, STEAM_TABLES_PLAN.md). OPTIONAL and pulled
# in only by the `steam` feature, which the `python` feature turns on so the
# wheel always ships `vle.steam`. `cargo add vle-thermo` stays lean (no steam)
# unless `--features steam` is requested. Version kept in sync with the
# workspace version by hand, as with `vle-units`.
vle-steam = { path = "../steam", version = "0.10.0", optional = true }
# `abi3-py310` builds against CPython's stable ABI starting at 3.10. One wheel
# per (OS, arch) then loads cleanly on CPython 3.10, 3.11, 3.12, 3.13 and any
# future 3.x — no rebuild per Python version. See docs/ci.md and
# MODERNIZATION_PLAN.md M5 phase notes for the performance analysis.
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py310"], optional = true }
# rust-numpy (M10, PERFORMANCE_PROPOSAL Track D): zero-copy ndarray views
# across the FFI boundary for the batch API — one crossing per *array*
# instead of one per state point. Version tracks pyo3 (0.22 ↔ 0.22).
numpy = { version = "0.22", optional = true }
# rayon (M10, Track D): data-parallel batch kernels. The GIL is released
# via `Python::allow_threads` around the rayon loops, so a batch flash
# saturates every core while other Python threads keep running. Gated
# behind the `python` feature — the pure-Rust crate stays single-threaded.
rayon = { version = "1", optional = true }

[dev-dependencies]
approx = "0.5"
# criterion drives the M8.2 benchmark suite (engine/benches/). Kept as a
# dev-dependency so it never enters the published crate's dependency
# closure. `html_reports` is off: CI consumes the plain-text output and
# the HTML generation pulls in plotters + a long tail of transitive deps.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

# `harness = false` hands `cargo bench` over to criterion's own runner
# (the default libtest harness has no stable bench support).
[[bench]]
name = "engine_bench"
harness = false

[features]
default = []
# Bundled Rust-side component database (M12.2, gap G3). Off by default so the
# core crate keeps zero new mandatory dependencies; downstream Rust consumers
# opt in with `cargo add vle-thermo --features component-db` to get
# `vle_thermo::db::component(name)` / `available()`. Pulls only serde +
# serde_json (both optional deps above).
component-db = ["dep:serde", "dep:serde_json"]
# IAPWS-IF97 steam tables (M13). Off by default so `cargo add vle-thermo` stays
# lean; a downstream Rust consumer opts in with `--features steam` to get the
# re-exported `vle_thermo::steam` surface. The `python` feature turns it on so
# the wheel always exposes `vle.steam`.
steam = ["dep:vle-steam"]
# Gate all PyO3 bindings behind this feature so `cargo add vle-thermo` pulls a
# pure-Rust crate without dragging in Python. Maturin enables it automatically
# from python/pyproject.toml when building the wheel. It also turns on
# `component-db` so the wheel can expose the Rust DB lookups (`db_component`,
# `db_available`) for testing the crate through Python.
python = ["dep:pyo3", "dep:numpy", "dep:rayon", "component-db", "steam"]
