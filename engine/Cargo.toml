[package]
name = "vle-thermo"
description = "Vapor-liquid equilibrium thermodynamic calculator: 22+ cubic EOS, activity models, mixing rules, flash algorithms"
readme = "README.md"
keywords = ["thermodynamics", "chemistry", "vle", "equation-of-state", "fluid"]
categories = ["science", "mathematics"]
documentation = "https://docs.rs/vle-thermo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
# The `cdylib` artifact is what maturin packages into the Python wheel as
# `vle/_engine.*.{so,dylib,pyd}`; the `rlib` artifact is what downstream Rust
# crates link against via `cargo add vle-thermo`.
name = "vle_thermo"
crate-type = ["cdylib", "rlib"]

[dependencies]
nalgebra = "0.33"
ndarray = "0.16"
# `abi3-py310` builds against CPython's stable ABI starting at 3.10. One wheel
# per (OS, arch) then loads cleanly on CPython 3.10, 3.11, 3.12, 3.13 and any
# future 3.x — no rebuild per Python version. See docs/ci.md and
# MODERNIZATION_PLAN.md M5 phase notes for the performance analysis.
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py310"], optional = true }

[dev-dependencies]
approx = "0.5"

[features]
default = []
# Gate all PyO3 bindings behind this feature so `cargo add vle-thermo` pulls a
# pure-Rust crate without dragging in Python. Maturin enables it automatically
# from python/pyproject.toml when building the wheel.
python = ["pyo3"]
