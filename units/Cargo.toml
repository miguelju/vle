[package]
name = "vle-units"
description = "Dimensional analysis and unit conversion for vapor-liquid equilibrium and thermodynamic calculations"
readme = "README.md"
keywords = ["units", "dimensional-analysis", "thermodynamics", "si", "uom"]
categories = ["science", "mathematics"]
documentation = "https://docs.rs/vle-units"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "vle_units"

[dependencies]
uom = { version = "0.36", default-features = false, features = ["autoconvert", "f64", "si", "std"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "1"

[dev-dependencies]
approx = "0.5"
