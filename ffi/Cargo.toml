# vle-ffi — the UniFFI wrapper crate that exposes the vle engine to Swift
# (iOS / macOS). See IOS_FFI_PLAN.md and docs/en/ios/README.md.
#
# This crate is a *thin adapter*: it owns no thermodynamics. It converts
# between the engine's idiomatic Rust API (borrowed slices, data-carrying
# enums) and the flat records / owned Vecs that cross the FFI boundary
# cleanly. It is `publish = false` — it never goes to crates.io; its build
# artifact (a static library) is consumed locally by scripts/build-ios.sh.

[package]
name = "vle-ffi"
description = "UniFFI (Swift) wrapper for the vle-thermo engine — local Apple builds only, never published"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "vle_ffi"
# `staticlib` produces the `libvle_ffi.a` that Xcode links into an app;
# `lib` (an rlib) is what `cargo test -p vle-ffi` links against. Both are
# built from the same source — no cfg differences between them.
crate-type = ["staticlib", "lib"]

[dependencies]
# The engine WITHOUT the `python` feature: pyo3 must never enter the Apple
# dependency graph (there is no Python on an iPhone). `component-db` gives
# the bundled component catalogue, `steam` the IAPWS-IF97 tables.
vle-thermo = { path = "../engine", features = ["component-db", "steam"] }
# UniFFI generates the C scaffolding on the Rust side (proc-macros) and the
# Swift wrapper on the other side (via ffi/uniffi-bindgen). Version pinned
# in lockstep with ffi/uniffi-bindgen/Cargo.toml — the scaffolding and the
# generator MUST be the same version or bindgen refuses the metadata.
uniffi = "0.32"
thiserror = "1"
