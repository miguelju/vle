# Cargo workspace manifest.
#
# Declares the two publishable Rust crates in this repo as workspace members so
# that `cargo build`, `cargo test`, and `cargo publish -p <name>` can be invoked
# from the repo root.
#
# Shared metadata (version, license, author, repository) lives under
# [workspace.package] and is inherited by each member's Cargo.toml via
# `<field>.workspace = true`. Bump the version here to release a new version
# of both crates at once.

[workspace]
resolver = "2"
members = ["engine", "units"]

# Release profile (PERFORMANCE_PROPOSAL.md §C5): fat LTO + single codegen
# unit let LLVM inline across crate boundaries (the α dispatch and cubic
# solver benefit most). `panic = "abort"` is deliberately NOT set — PyO3
# needs unwinding to convert Rust panics into Python exceptions instead of
# aborting the host interpreter. Wheels stay portable: no target-cpu=native.
[profile.release]
lto = "fat"
codegen-units = 1

# The bench profile inherits `release`, so criterion numbers measure the
# same optimization level users get from the published crate/wheel.
[profile.bench]
inherits = "release"

[workspace.package]
version = "0.8.2"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Miguel Jackson <admin@migueljackson.dev>"]
repository = "https://github.com/miguelju/vle"
homepage = "https://github.com/miguelju/vle"
