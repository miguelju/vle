[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
# Distribution name on PyPI. The Python import name stays `vle` (see
# python-source = "src" + the src/vle/ directory) following the common
# "distribution != import" pattern (Pillow → PIL, python-dateutil → dateutil).
name = "vle-thermo"
version = "0.1.0"
description = "Vapor-liquid equilibrium (VLE) thermodynamic calculator: 22+ cubic EOS, activity models, flash algorithms"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Miguel Jackson", email = "admin@migueljackson.dev" },
]
keywords = [
    "thermodynamics",
    "chemistry",
    "vapor-liquid-equilibrium",
    "equation-of-state",
    "chemical-engineering",
    "flash-calculation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7.0", "maturin>=1.0"]
db = ["thermo>=0.3"]

[project.urls]
Homepage = "https://github.com/miguelju/vle"
Repository = "https://github.com/miguelju/vle"
Issues = "https://github.com/miguelju/vle/issues"
Changelog = "https://github.com/miguelju/vle/blob/main/ROADMAP.md"

[project.scripts]
vle-db = "vle.cli.main:main"

[tool.maturin]
# Path to the Rust crate that produces the native extension module
manifest-path = "../engine/Cargo.toml"
# Build with the "python" feature flag to enable PyO3 bindings
features = ["python"]
# Python source layout: pure Python code lives alongside the native module
python-source = "src"
# The native module will be importable as vle._engine
module-name = "vle._engine"
# Ship the bundled SQLite schema + seed data inside the wheel and sdist so
# the package is self-contained. Loaded via importlib.resources in
# vle.db.connection / vle.db.seed.
include = [
    { path = "src/vle/db/sql/*.sql", format = ["sdist", "wheel"] },
]
