[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
# Distribution name on PyPI. The Python import name stays `vle` (see
# python-source = "src" + the src/vle/ directory) following the common
# "distribution != import" pattern (Pillow → PIL, python-dateutil → dateutil).
name = "vle-thermo"
version = "0.1.0"
description = "Vapor-liquid equilibrium (VLE) thermodynamic calculator: 22+ cubic EOS, activity models, flash algorithms"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Miguel Jackson", email = "admin@migueljackson.dev" },
]
keywords = [
    "thermodynamics",
    "chemistry",
    "vapor-liquid-equilibrium",
    "equation-of-state",
    "chemical-engineering",
    "flash-calculation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7.0", "maturin>=1.0"]
db = ["thermo>=0.3"]

[project.urls]
Homepage = "https://github.com/miguelju/vle"
Repository = "https://github.com/miguelju/vle"
Issues = "https://github.com/miguelju/vle/issues"
Changelog = "https://github.com/miguelju/vle/blob/main/ROADMAP.md"

[project.scripts]
vle-db = "vle.cli.main:main"

[tool.maturin]
# Path to the Rust crate that produces the native extension module
manifest-path = "../engine/Cargo.toml"
# Build with the "python" feature flag to enable PyO3 bindings
features = ["python"]
# Python source layout: pure Python code lives alongside the native module
python-source = "src"
# The native module will be importable as vle._engine
module-name = "vle._engine"
# Ship the bundled SQLite schema + seed data inside the wheel and sdist so
# the package is self-contained. Loaded via importlib.resources in
# vle.db.connection / vle.db.seed.
include = [
    { path = "src/vle/db/sql/*.sql", format = ["sdist", "wheel"] },
]

[tool.cibuildwheel]
# abi3 wheels: PyO3's abi3-py310 feature (set in engine/Cargo.toml) makes
# one wheel per (os, arch) cover CPython 3.10, 3.11, 3.12, 3.13 and future
# versions. The `cp310-` selector below is the lowest Python that abi3
# targets; the resulting wheel filenames are tagged `cp310-abi3-*` and
# pip installs them on any CPython >= 3.10. Result: ~4x faster wheel
# matrix than per-CPython wheels with negligible runtime cost for this
# workload (see the Performance analysis in MODERNIZATION_PLAN.md).
build = "cp310-*"
skip = ["pp*", "*-musllinux_*"]
# manylinux_2_28 ~ AlmaLinux 8 — needed for Rust edition 2024 / MSRV 1.85.
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
test-requires = ["pytest"]
# {package} expands to the cibuildwheel `package-dir` (= python/ here),
# so this resolves to python/tests/, the existing pytest suite. Don't use
# {project} — that's the *whole repo root* that cibuildwheel copies into
# the container, not the package dir, and `pytest {project}/tests` would
# look at /project/tests which does not exist.
test-command = "pytest {package}/tests"
build-verbosity = 1

[tool.cibuildwheel.macos]
# arm64 only — no Intel macOS cross-build. See MODERNIZATION_PLAN.md M5
# notes for the rationale (negligible Intel macOS install base; easy to
# add later if a user reports needing it).
archs = ["arm64"]

[tool.cibuildwheel.linux]
# `auto` resolves to the runner's native arch (x86_64 on the self-hosted
# Linux runner; aarch64 on ubuntu-24.04-arm). No QEMU emulation.
archs = ["auto"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]
